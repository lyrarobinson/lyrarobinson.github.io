<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/scrollbar.css">
  <link href="https://fonts.googleapis.com/css2?family=Liberation+Mono&display=swap" rel="stylesheet">
  <title>worm - Lyra Robinson</title>
<meta name="description" content="alternative operations by new media artist Lyra Robinson - digital art installation exploring alternative computational processes">
  <style>
      body {
		  font-family: 'Liberation Mono', monospace;
          margin: 0;
          padding: 20px;
          background-color: white;
          line-height: 1.4;
          overflow-x: hidden;
      }
      
      .image-container {
          width: calc(100% - 40px);
          max-width: 800px;
          margin: 0 auto 40px auto;
      }
      
      .image-display {
          width: 100%;
          height: auto;
          display: block;
          margin-bottom: 40px;
      }
      
      .content {
          max-width: 800px;
          margin: 0 auto;
      }
      
      p {
          font-size: 16px;
          margin: 0 0 20px 0;
          text-align: left;
      }
      
      /* Mobile styles */
      @media screen and (max-width: 768px) {
          body {
              padding: 15px;
          }
          
          .image-container {
              width: calc(100% - 30px);
              max-width: 400px;
              margin-bottom: 30px;
          }
          
          .image-display {
              margin-bottom: 30px;
          }
          
          p {
              font-size: 14px;
          }
      }
  </style>
</head>
<body>
    <div class="content">

  <div class="image-container">
      <img src="../assets/worm1.png" alt="Worm simulation" class="image-display">
  </div>

  <div class="content">
      <p>Screenshots of the environment simulation. there's the worms, the bacteria they like to eat, and chemical traces they use for navigation, and a visual of their neural activity.</p>
              <p>I'm performing this on tuesday 16th, so I'll be able to update with more pictures after that :)</p>



	</div>

  <div class="image-container">
      <img src="../assets/worm1.gif" alt="Worm simulation" class="image-display">
  </div>

  <div class="image-container">
      <img src="../assets/worm2.png" alt="Worm simulation" class="image-display">
  </div>

  <div class="image-container">
      <img src="../assets/worm3.png" alt="Worm simulation" class="image-display">
  </div>

</div>
</body>
</html>
